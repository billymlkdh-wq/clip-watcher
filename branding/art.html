<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000}
  .scene{position:relative;overflow:hidden;
    background:linear-gradient(180deg,#140629 0%,#3b0a5e 28%,#a3176e 52%,#ff5a5f 68%,#ffb347 80%,#2a0838 80.2%,#12031f 100%)}
  .sun{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;
    background:repeating-linear-gradient(180deg,#ffe56b 0 14%,#ff8a3d 14% 16%,#ffb347 16% 30%,transparent 30% 33%);
    background:linear-gradient(180deg,#fff27a,#ff9a3c 55%,#ff3d7f);
    -webkit-mask:repeating-linear-gradient(180deg,#000 0 62%,transparent 62% 66%,#000 66% 72%,transparent 72% 77%,#000 77% 82%,transparent 82% 88%,#000 88% 92%,transparent 92% 100%);
    box-shadow:0 0 120px 40px rgba(255,120,80,.45)}
  .grid{position:absolute;left:-50%;width:200%;bottom:0;
    background-image:linear-gradient(rgba(255,70,200,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(255,70,200,.55) 2px,transparent 2px);
    transform:perspective(500px) rotateX(62deg);transform-origin:bottom}
  svg.city,svg.palm{position:absolute;bottom:0}
  .title{position:absolute;left:50%;transform:translateX(-50%) skewX(-8deg);text-align:center;white-space:nowrap;
    font-family:'Anton',sans-serif;color:#fff;letter-spacing:.02em;line-height:.9;
    text-shadow:0 0 0 #000, 6px 6px 0 #ff2fa0, 12px 12px 0 #3b0a5e, 0 0 40px rgba(255,80,200,.7)}
  .stars{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:.25em}
  .stars span{color:#fff;text-shadow:0 0 18px #ffd84d,4px 4px 0 #ff2fa0}
  .tag{position:absolute;left:50%;transform:translateX(-50%);font-family:'Bebas Neue',sans-serif;color:#ffe9a8;
    letter-spacing:.18em;white-space:nowrap;text-shadow:0 0 14px rgba(255,120,60,.9)}
</style></head>
<body>

<!-- AVATAR 800x800 -->

</body></html>
